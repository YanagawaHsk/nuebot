<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小小鵺 · 托管维护</title><style>body{margin:0;background:#f6f4fb;color:#252137;font:15px/1.7 'Microsoft YaHei',sans-serif}main{max-width:780px;margin:50px auto;padding:0 20px}.card{background:white;border:1px solid #e8e3f0;border-radius:20px;padding:28px;margin:20px 0}h1{margin:0}small,.muted{color:#797388}label{display:block;margin:14px 0}input{display:block;width:100%;box-sizing:border-box;border:1px solid #e8e3f0;border-radius:10px;padding:12px;margin-top:6px;font:inherit}button{cursor:pointer;border:1px solid #e8e3f0;border-radius:10px;background:white;padding:10px 16px;font:inherit;margin:6px 8px 6px 0}.primary{background:#7154c6;color:white}.danger{color:#b64365}.result{white-space:pre-wrap;color:#655084}table{width:100%;text-align:left}td,th{padding:10px;border-bottom:1px solid #e8e3f0}.badge{background:#ede7ff;border-radius:20px;padding:5px 12px;font-size:12px}a{color:#7154c6}</style><main><h1>小小鵺 <span class="badge">托管维护 · v__VERSION__</span></h1><p id="who" class="muted"></p><button id="logout">退出登录</button><section class="card"><h2>机器人运行</h2><p>可查看状态、启动、停止或重启。人设、群配置、API、天网、插件及账号由主管理员管理。</p><div id="status" class="result">读取中…</div><button data-action="start" class="primary">启动</button><button data-action="stop" class="danger">停止</button><button data-action="restart">重启</button><div id="result" class="result" role="status"></div></section><section class="card"><h2>最近运行事件</h2><div id="events" class="result"></div></section><section class="card"><h2>程序版本</h2><div id="updates" class="result"></div><p class="muted">托管账号不能修改检查地址或安装版本。请由主管理员批准更新。</p></section><section class="card"><h2>修改本人密码</h2><form id="password-form"><label>原密码<input id="old-password" type="password" autocomplete="current-password" required></label><label>新密码<input id="new-password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><button>修改后重新登录</button><div id="password-result" class="result"></div></form></section></main><script>const csrf='__CSRF__';const $=s=>document.querySelector(s);async function api(path,body){const r=await fetch(path,{method:body===undefined?'GET':'POST',headers:{'X-Panel-Token':csrf,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const v=await r.json();if(r.status===401&&path!='/api/auth/login'&&path!='/api/auth/setup'){location.reload();throw Error('请重新登录')}if(!r.ok)throw Error(v.error||'操作失败');return v}function show(v){$('#result').textContent=v}
const stateNames={stopped:'已停止',waiting_connection:'等待QQ连接',running:'运行中',connected:'已连接'};async function refresh(){try{const s=await api('/api/status');$('#status').textContent=(s.fresh?'后台在线':'后台未在线')+' · '+(stateNames[s.state]||s.state||'等待状态')+'\n'+s.groups.map(g=>'群 '+g.group+'：'+(g.fresh?'在线':'未在线')).join('\n');const e=await api('/api/events');$('#events').textContent=e.events.map(x=>x.time+' '+x.message).join('\n')||'暂无运行事件';const u=await api('/api/updates');$('#updates').textContent='当前 v'+u.current.version+(u.latest_version?' · 发布 v'+u.latest_version:'')}catch(e){show(e.message)}}
api('/api/auth/session').then(s=>$('#who').textContent=s.username+' · 托管人员 · 登录有效期8小时').catch(e=>show(e.message));refresh();setInterval(refresh,5000);
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const v=await api('/api/control',{action:b.dataset.action});show(v.message);await refresh()}catch(e){show(e.message)}finally{b.disabled=false}});
$('#logout').onclick=async()=>{try{await api('/api/auth/logout',{});location.reload()}catch(e){show(e.message)}};
$('#password-form').onsubmit=async e=>{e.preventDefault();try{await api('/api/auth/password',{old_password:$('#old-password').value,password:$('#new-password').value});location.reload()}catch(e){$('#password-result').textContent=e.message}};
</script></html>
