<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小小鵺 · 登录</title><style>[hidden]{display:none!important}body{margin:0;background:#f6f4fb;color:#252137;font:15px/1.7 'Microsoft YaHei',sans-serif}main{max-width:780px;margin:50px auto;padding:0 20px}.card{background:white;border:1px solid #e8e3f0;border-radius:20px;padding:28px;margin:20px 0}h1{margin:0}small,.muted{color:#797388}label{display:block;margin:14px 0}input{display:block;width:100%;box-sizing:border-box;border:1px solid #e8e3f0;border-radius:10px;padding:12px;margin-top:6px;font:inherit}button{cursor:pointer;border:1px solid #e8e3f0;border-radius:10px;background:white;padding:10px 16px;font:inherit;margin:6px 8px 6px 0}.primary{background:#7154c6;color:white}.danger{color:#b64365}.result{white-space:pre-wrap;color:#655084}table{width:100%;text-align:left}td,th{padding:10px;border-bottom:1px solid #e8e3f0}.badge{background:#ede7ff;border-radius:20px;padding:5px 12px;font-size:12px}a{color:#7154c6}</style><main><h1>小小鵺 <span class="badge">v__VERSION__</span></h1><p class="muted">登录后按你的角色显示管理功能。</p><section class="card"><h2 id="heading">登录控制室</h2><p id="setup-note" hidden>首次使用请读取程序目录中的 <b>admin-setup-code.txt</b>，由主管理员创建自己的账号。不要把初始化码交给托管人员；完成后文件自动删除。</p><form id="form"><label id="code-row" hidden>初始化码<input id="code" type="password" autocomplete="off"></label><label>账号<input id="username" minlength="3" maxlength="40" pattern="[A-Za-z0-9_.-]{3,40}" autocomplete="username" required placeholder="例如 yanagawa"></label><label>密码<input id="password" type="password" minlength="12" maxlength="128" autocomplete="current-password" required></label><label id="confirm-row" hidden>再次输入密码<input id="confirm" type="password" autocomplete="new-password"></label><button class="primary" id="submit">登录</button><div id="result" class="result" role="status"></div></form></section><small>仅通过本机或私有隧道访问。主管理员掌管配置，托管人员负责运行维护。</small></main><script>const csrf='__CSRF__';const $=s=>document.querySelector(s);async function api(path,body){const r=await fetch(path,{method:body===undefined?'GET':'POST',headers:{'X-Panel-Token':csrf,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const v=await r.json();if(r.status===401&&path!='/api/auth/login'&&path!='/api/auth/setup'){location.reload();throw Error('请重新登录')}if(!r.ok)throw Error(v.error||'操作失败');return v}function show(v){$('#result').textContent=v}
const setup=__SETUP__;if(setup){$('#heading').textContent='创建主管理员';$('#setup-note').hidden=false;$('#code-row').hidden=false;$('#confirm-row').hidden=false;$('#password').autocomplete='new-password';$('#confirm').required=true;$('#code').required=true;$('#submit').textContent='创建并进入控制室'}
$('#form').onsubmit=async e=>{e.preventDefault();if(setup&&$('#password').value!==$('#confirm').value)return show('两次密码不一致');$('#submit').disabled=true;try{await api(setup?'/api/auth/setup':'/api/auth/login',{username:$('#username').value,password:$('#password').value,code:$('#code').value.trim()});location.reload()}catch(e){show(e.message)}finally{$('#submit').disabled=false}};
</script></html>
